              ),
              (
                  "v1",
                  "youtube",
                  "read.subtitles",
                  "youtube.read.subtitles.arguments.v1",
                  ("youtube.subtitle.v1",),
                  "yt-dlp",
                  "2026.7.4",
                  ("network_access.v1", "private_workspace.v1"),
                  1,
                  1_048_576,
                  16_384,
                  524_288,
                  512,
                  8_192,
                  16_000,
                  4_096,
                  8_192,
                  512,
                  1_024,
                  512,
              ),
              (
                  "v1",
                  "v2ex",
                  "browse.hot",
                  "v2ex.browse.hot.arguments.v1",
                  ("v2ex.topic.v1",),
                  "v2ex-public-api",
                  "legacy-json-2026-07-31",
                  ("network_access.v1",),
