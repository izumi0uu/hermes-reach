                  "6.0.12",
                  ("fetched_document.v1",),
                  21,
                  1_048_576,
                  16_384,
                  1_048_576,
                  512,
                  8_192,
                  16_000,
                  4_096,
                  8_192,
                  512,
                  2_048,
                  512,
              ),
              (
                  "v1",
                  "bilibili",
                  "search.videos",
                  "bilibili.search.videos.arguments.v1",
                  ("bilibili.video.v1",),
                  "bili-cli",
                  "0.6.2",
                  ("network_access.v1",),
                  50,
                  1_048_576,
                  16_384,
                  524_288,
                  512,
                  8_192,
                  16_000,
                  4_096,
                  8_192,
                  512,
                  1_024,
                  512,
              ),
              (
                  "v1",
                  "bilibili",
                  "read.video",
                  "bilibili.read.video.arguments.v1",
                  ("bilibili.video.v1",),
                  "bili-cli",
                  "0.6.2",
                  ("network_access.v1",),
                  1,
                  1_048_576,
                  16_384,
                  524_288,
                  512,
                  8_192,
                  16_000,
                  4_096,
                  8_192,
                  512,
                  1_024,
                  512,
              ),
              (
                  "v1",
                  "bilibili",
                  "browse.hot",
                  "bilibili.browse.hot.arguments.v1",
                  ("bilibili.video.v1",),
                  "bili-cli",
                  "0.6.2",
                  ("network_access.v1",),
                  50,
                  1_048_576,
                  16_384,
                  524_288,
                  512,
                  8_192,
                  16_000,
                  4_096,
                  8_192,
                  512,
                  1_024,
                  512,
              ),
              (
                  "v1",
                  "bilibili",
                  "browse.rank",
                  "bilibili.browse.rank.arguments.v1",
                  ("bilibili.video.v1",),
                  "bili-cli",
                  "0.6.2",
                  ("network_access.v1",),
                  50,
                  1_048_576,
                  16_384,
                  524_288,
                  512,
                  8_192,
                  16_000,
                  4_096,
                  8_192,
                  512,
                  1_024,
                  512,
              ),
              (
                  "v1",
                  "youtube",
                  "read.video",
                  "youtube.read.video.arguments.v1",
                  ("youtube.video.v1",),
                  "yt-dlp",
                  "2026.7.4",
                  ("network_access.v1",),
                  1,
                  1_048_576,
                  16_384,
                  524_288,
                  512,
                  8_192,
                  16_000,
                  4_096,
                  8_192,
                  512,
                  1_024,
                  512,
              ),
              (
                  "v1",
