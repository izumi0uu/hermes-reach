[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-reach"
version = "0.1.0a0"
description = "Hermes plugin for reliable, normalized platform reach"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Booker" }]
dependencies = [
  "agent-reach @ git+https://github.com/Panniantong/Agent-Reach.git@1494c2ab239e7355a77e7cceaf3271453a1f34b5",
  "bilibili-cli==0.6.2",
  "cryptography>=46.0.7,<47",
  "deno==2.8.3",
  "feedparser==6.0.12",
  "hermes-agent>=0.19.0,<0.20.0",
  "httpcore>=1.0.9,<2",
  "PyYAML>=6.0.2,<7",
  "websockets>=15.0.1,<16",
  "yt-dlp==2026.7.4",
  "yt-dlp-ejs==0.8.0",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/izumi0uu/hermes-reach"
Issues = "https://github.com/izumi0uu/hermes-reach/issues"

[project.entry-points."hermes_agent.plugins"]
reach = "hermes_reach"

[dependency-groups]
dev = [
  "build==1.2.2.post1",
  "mypy==1.15.0",
  "packaging==26.0",
  "pytest==8.3.5",
  "ruff==0.11.2",
  "types-PyYAML>=6.0.12.20250516,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_reach = ["skill/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".agents", ".codex", ".omx", ".trellis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
